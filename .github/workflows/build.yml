name: Build & Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  tests:
    name: Desktop Tests (21+)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Run tests
        run: ./gradlew :composeApp:desktopTest --no-daemon

  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: ./gradlew :composeApp:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: syna-apk
          path: composeApp/build/outputs/apk/debug/composeApp-debug.apk
          if-no-files-found: error

  server:
    name: Syna Server jar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build server fat jar
        run: ./gradlew :composeApp:serverFatJar --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: syna-server
          path: composeApp/build/server/syna-server.jar
          if-no-files-found: error

  macos-dmg:
    name: macOS DMG
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build DMG
        run: ./gradlew :composeApp:packageDmg --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: syna-dmg
          path: composeApp/build/compose/binaries/main/dmg/*.dmg
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [tests, android, server, macos-dmg]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" artifacts/* \
            --title "Syna $TAG" \
            --notes "Automated build from GitHub Actions." \
            --repo "$GITHUB_REPOSITORY" || \
          gh release upload "$TAG" artifacts/* --clobber --repo "$GITHUB_REPOSITORY"
